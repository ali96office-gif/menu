<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>المنيو</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#241B15">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المنيو">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#241B15;
    --bg-card:#2F241C;
    --bg-card-2:#382B21;
    --accent:#E8A93D;
    --accent-2:#C6624B;
    --text:#F5EDE2;
    --text-muted:#C9BBAA;
    --line: rgba(245,237,226,0.12);
    --radius: 18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .hero{
    text-align:center;
    padding:38px 20px 26px;
    background:
      radial-gradient(120% 100% at 50% 0%, rgba(232,169,61,0.16) 0%, rgba(36,27,21,0) 60%);
  }
  .hero img{
    width:78px; height:78px; border-radius:50%;
    object-fit:cover; margin-bottom:12px;
    border:2px solid var(--accent);
  }
  .hero h1{
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:28px;
    letter-spacing:0.5px;
  }
  .hero p{
    color:var(--text-muted);
    font-size:14px;
    margin-top:6px;
  }
  .tabs{
    position:sticky; top:0; z-index:10;
    display:flex; gap:8px; overflow-x:auto;
    padding:14px 16px;
    background:linear-gradient(180deg, var(--bg) 70%, rgba(36,27,21,0));
    backdrop-filter: blur(6px);
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:9px 18px;
    border-radius:999px;
    background:var(--bg-card);
    color:var(--text-muted);
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:14px;
    border:1px solid var(--line);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--accent);
    color:#241B15;
    border-color:var(--accent);
  }
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
    padding:6px 16px 20px;
    max-width:640px;
    margin:0 auto;
  }
  @media(min-width:560px){
    .grid{grid-template-columns:1fr 1fr;}
  }
  .card{
    background:var(--bg-card);
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--line);
    position:relative;
  }
  .card .img-wrap{
    width:100%; aspect-ratio:4/3;
    background:var(--bg-card-2);
    overflow:hidden;
    position:relative;
  }
  .card img.item-img{
    width:100%; height:100%; object-fit:cover; display:block;
    cursor:pointer;
  }
  .no-img{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); font-size:13px;
  }
  .offer-badge{
    position:absolute; top:10px; left:10px;
    background:var(--accent-2);
    color:#fff;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:12px;
    padding:4px 10px;
    border-radius:999px;
  }
  .card-body{ padding:14px 14px 16px; }
  .card-body h3{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:17px;
    margin-bottom:4px;
  }
  .flavors{
    display:flex; flex-wrap:wrap; gap:6px;
    margin:8px 0 10px;
  }
  .flavor-chip{
    font-size:12px;
    color:var(--text-muted);
    border:1px solid var(--line);
    padding:3px 9px;
    border-radius:999px;
  }
  .sizes{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom:10px;
  }
  .size-btn{
    font-family:'Tajawal', sans-serif;
    font-size:13px;
    padding:6px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
  }
  .size-btn.active{
    border-color:var(--accent);
    color:var(--accent);
    background:rgba(232,169,61,0.08);
  }
  .price-row{
    display:flex; align-items:center; justify-content:flex-end;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    position:relative;
  }
  .price-row::before, .price-row::after{
    content:"";
    position:absolute; top:-6px;
    width:12px; height:12px;
    border-radius:50%;
    background:var(--bg);
  }
  .price-row::before{ right:-14px; }
  .price-row::after{ left:-14px; }
  .price-value{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .price-tag{
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:19px;
    color:var(--accent);
    white-space:nowrap;
  }
  .old-price{
    font-size:13px;
    color:var(--text-muted);
    text-decoration:line-through;
    white-space:nowrap;
  }
  .empty{
    text-align:center;
    color:var(--text-muted);
    padding:60px 20px;
    font-size:14px;
  }
  .cat-section{
    width:100%;
    max-width:640px;
    margin:0 auto 26px;
    padding:0 6px;
  }
  .cat-title{
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:19px;
    color:var(--accent);
    margin-bottom:10px;
    padding-bottom:8px;
    border-bottom:2px solid var(--accent);
    display:inline-block;
  }
  .menu-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 2px;
    border-bottom:1px dotted var(--line);
    cursor:pointer;
  }
  .row-thumb{
    width:56px; height:56px;
    border-radius:10px;
    object-fit:cover;
    flex:0 0 56px;
    background:var(--bg-card-2);
    cursor:pointer;
  }
  .row-thumb-empty{
    width:56px; height:56px;
    border-radius:10px;
    flex:0 0 56px;
    background:var(--bg-card-2);
  }
  .row-info{ flex:1 1 0%; min-width:0; overflow:hidden; }
  .row-name-line{
    display:flex; align-items:center; gap:7px;
    margin-bottom:3px;
    flex-wrap:wrap;
  }
  .row-name{
    font-family:'Tajawal', sans-serif;
    font-weight:500;
    font-size:15px;
  }
  .row-flavor{
    font-family:'Tajawal', sans-serif;
    font-weight:400;
    font-size:12px;
    color:var(--text-muted);
  }
  .row-offer-badge{
    background:var(--accent-2);
    color:#fff;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:10px;
    padding:2px 8px;
    border-radius:999px;
    flex:0 0 auto;
  }
  .row-sizes{
    font-size:13px;
    color:var(--text-muted);
    display:flex; flex-wrap:wrap; gap:2px 10px;
  }
  .row-size-item{ white-space:nowrap; }
  .row-price{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    color:var(--accent);
  }
  .row-old-price{
    font-size:11px;
    color:var(--text-muted);
    text-decoration:line-through;
    margin-left:4px;
  }
  .lightbox-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    align-items:center; justify-content:center;
    z-index:1000; padding:24px;
  }
  .lightbox-overlay.active{ display:flex; }
  .lightbox-overlay img{
    max-width:100%; max-height:100%;
    border-radius:12px;
  }
  .back-bar{
    max-width:640px; margin:0 auto; padding:2px 16px 12px;
  }
  .back-btn{
    background:var(--bg-card); color:var(--text);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 18px;
    font-family:'Cairo', sans-serif;
    font-weight:700; font-size:13px;
    cursor:pointer;
  }
  .add-cart-btn{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#241B15;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .cart-bar{
    position:fixed;
    bottom:0; left:0; right:0;
    display:none;
    align-items:center; justify-content:space-between;
    background:var(--accent);
    color:#241B15;
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:15px;
    padding:14px 22px;
    cursor:pointer;
    z-index:900;
  }
  .cart-bar.active{ display:flex; }
  .cart-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:flex-end;
    z-index:1000;
  }
  .cart-overlay.active{ display:flex; }
  .cart-sheet{
    background:var(--bg);
    width:100%;
    max-height:85vh;
    border-radius:20px 20px 0 0;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .cart-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .cart-header h2{
    font-family:'Cairo', sans-serif;
    font-weight:800; font-size:18px;
  }
  .cart-close{
    background:none; border:none; color:var(--text);
    font-size:18px; cursor:pointer;
  }
  .cart-body{
    padding:10px 20px;
    overflow-y:auto;
    flex:1;
  }
  .cart-line{
    padding:12px 0;
    border-bottom:1px dotted var(--line);
  }
  .cart-line-info{
    display:flex; justify-content:space-between;
    margin-bottom:8px;
  }
  .cart-line-name{
    font-family:'Tajawal', sans-serif;
    font-weight:500; font-size:14px;
  }
  .cart-line-price{
    color:var(--accent);
    font-family:'Cairo', sans-serif;
    font-weight:700; font-size:13px;
  }
  .cart-line-actions{
    display:flex; align-items:center; gap:10px;
  }
  .cart-line-actions button{
    width:28px; height:28px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--bg-card);
    color:var(--text);
    font-size:16px;
    cursor:pointer;
  }
  .cart-line-actions span{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    min-width:20px;
    text-align:center;
  }
  .cart-remove{
    margin-right:auto;
    width:auto !important;
    padding:0 10px;
    color:var(--accent-2) !important;
    font-size:12px !important;
    border:none !important;
    background:none !important;
  }
  .cart-footer{
    padding:14px 20px 20px;
    border-top:1px solid var(--line);
  }
  .cart-total-row{
    display:flex; justify-content:space-between;
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:6px;
  }
  .cart-total-final{
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:17px;
    color:var(--text);
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line);
  }
  .cart-footer input{
    width:100%;
    padding:10px 12px;
    margin-top:8px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--bg-card);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    font-size:13px;
  }
  .cart-send-btn{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:none;
    border-radius:12px;
    background:#25D366;
    color:#fff;
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="hero">
  <img id="logoImg" src="" alt="" style="display:none;">
  <h1 id="shopName">المنيو</h1>
  <p id="shopTagline"></p>
</div>

<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
</div>

<div class="cart-bar" id="cartBar" onclick="openCart()"></div>

<div class="cart-overlay" id="cartOverlay">
  <div class="cart-sheet">
    <div class="cart-header">
      <h2>طلبك</h2>
      <button class="cart-close" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-footer" id="cartFooter">
      <div class="cart-total-row"><span>المجموع الفرعي</span><span id="cartSubtotal">0 د.ع</span></div>
      <div class="cart-total-row"><span>التوصيل</span><span id="cartDelivery">0 د.ع</span></div>
      <div class="cart-total-row cart-total-final"><span>الإجمالي</span><span id="cartTotal">0 د.ع</span></div>
      <input id="custName" placeholder="اسمك (اختياري)">
      <input id="custPhone" placeholder="رقم هاتفك (اختياري)">
      <input id="custAddress" placeholder="عنوانك (اختياري)">
      <button class="cart-send-btn" onclick="sendWhatsAppOrder()">إرسال الطلب عبر واتساب</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
let categories = {};
let items = {};
let activeCat = "all";
let viewingItem = null;
let settings = {};
let selectedSize = {};
let cart = {};
try { cart = JSON.parse(localStorage.getItem('menu_cart') || '{}'); } catch(e) { cart = {}; }

function openLightbox(url, ev){
  if(ev) ev.stopPropagation();
  if(!url) return;
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightboxOverlay').classList.add('active');
}
function closeLightbox(){
  document.getElementById('lightboxOverlay').classList.remove('active');
}

function showItemDetail(id, ev){
  if(ev) ev.stopPropagation();
  viewingItem = id;
  renderGrid();
  window.scrollTo({top:0, behavior:"smooth"});
}
function closeItemDetail(){
  viewingItem = null;
  renderGrid();
}

function saveCart(){
  try { localStorage.setItem('menu_cart', JSON.stringify(cart)); } catch(e){}
  renderCartBar();
}

function addToCart(id, ev){
  if(ev) ev.stopPropagation();
  const it = items[id];
  if(!it) return;
  const idx = selectedSize[id] || 0;
  const sizes = it.sizes && it.sizes.length ? it.sizes : [{label:"", price: it.price || 0}];
  const offerActive = !!(it.offer && it.offer.active && it.offer.discountPrice);
  const price = (idx === 0 && offerActive) ? it.offer.discountPrice : sizes[idx].price;
  const sizeLabel = sizes[idx].label || "";
  const key = id + "|" + sizeLabel;
  if(!cart[key]){
    cart[key] = { itemId:id, name:it.name, sizeLabel, price, qty:0 };
  }
  cart[key].qty += 1;
  saveCart();
}

function changeCartQty(key, delta){
  if(!cart[key]) return;
  cart[key].qty += delta;
  if(cart[key].qty <= 0) delete cart[key];
  saveCart();
  renderCartModal();
}

function removeCartItem(key){
  delete cart[key];
  saveCart();
  renderCartModal();
}

function cartTotals(){
  const lines = Object.entries(cart);
  const subtotal = lines.reduce((sum,[k,l])=> sum + l.price * l.qty, 0);
  const delivery = Number(settings.deliveryFee) || 0;
  const total = subtotal + (lines.length ? delivery : 0);
  return { subtotal, delivery, total, count: lines.reduce((n,[k,l])=>n+l.qty,0) };
}

function renderCartBar(){
  const bar = document.getElementById('cartBar');
  if(!bar) return;
  if(!settings.whatsappEnabled){ bar.classList.remove('active'); return; }
  const { total, count } = cartTotals();
  if(count === 0){ bar.classList.remove('active'); return; }
  bar.classList.add('active');
  bar.innerHTML = `<span>🛒 السلة (${count})</span><span>${total} د.ع</span>`;
}

function openCart(){
  document.getElementById('cartOverlay').classList.add('active');
  renderCartModal();
}
function closeCart(){
  document.getElementById('cartOverlay').classList.remove('active');
}

function renderCartModal(){
  const body = document.getElementById('cartBody');
  const lines = Object.entries(cart);
  if(lines.length === 0){
    body.innerHTML = `<div class="empty">السلة فاضية</div>`;
    document.getElementById('cartFooter').style.display = 'none';
    return;
  }
  document.getElementById('cartFooter').style.display = 'block';
  body.innerHTML = lines.map(([key,l])=>`
    <div class="cart-line">
      <div class="cart-line-info">
        <span class="cart-line-name">${l.name}${l.sizeLabel ? ' ('+l.sizeLabel+')' : ''}</span>
        <span class="cart-line-price">${l.price} د.ع</span>
      </div>
      <div class="cart-line-actions">
        <button onclick="changeCartQty('${key}', -1)">−</button>
        <span>${l.qty}</span>
        <button onclick="changeCartQty('${key}', 1)">+</button>
        <button class="cart-remove" onclick="removeCartItem('${key}')">حذف</button>
      </div>
    </div>`).join("");

  const { subtotal, delivery, total } = cartTotals();
  document.getElementById('cartSubtotal').textContent = subtotal + ' د.ع';
  document.getElementById('cartDelivery').textContent = delivery + ' د.ع';
  document.getElementById('cartTotal').textContent = total + ' د.ع';
}

function sendWhatsAppOrder(){
  const lines = Object.entries(cart);
  if(lines.length === 0) return;
  const number = (settings.whatsappNumber || "").replace(/[^0-9]/g,'');
  if(!number){ alert("رقم الواتساب مو مضبوط، تواصل مع صاحب المحل"); return; }

  const { subtotal, delivery, total } = cartTotals();
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();

  let msg = `🧾 طلب جديد من المنيو\n\n`;
  lines.forEach(([key,l])=>{
    msg += `- ${l.name}${l.sizeLabel ? ' ('+l.sizeLabel+')' : ''} × ${l.qty} = ${l.price*l.qty} د.ع\n`;
  });
  msg += `\nالمجموع الفرعي: ${subtotal} د.ع\nالتوصيل: ${delivery} د.ع\nالإجمالي: ${total} د.ع`;
  if(name) msg += `\n\nالاسم: ${name}`;
  if(phone) msg += `\nرقم الهاتف: ${phone}`;
  if(address) msg += `\nالعنوان: ${address}`;

  window.open(`https://wa.me/${number}?text=${encodeURIComponent(msg)}`, '_blank');

  cart = {};
  saveCart();
  renderCartModal();
  closeCart();
}

db.ref("settings").on("value", snap=>{
  const s = snap.val() || {};
  settings = s;
  document.getElementById("shopName").textContent = s.shopName || "المنيو";
  document.getElementById("shopTagline").textContent = s.tagline || "";
  if(s.primaryColor) document.documentElement.style.setProperty('--accent', s.primaryColor);
  if(s.secondaryColor) document.documentElement.style.setProperty('--accent-2', s.secondaryColor);
  if(s.bgColor) document.documentElement.style.setProperty('--bg', s.bgColor);
  const logo = document.getElementById("logoImg");
  if(s.logoUrl){ logo.src = s.logoUrl; logo.style.display="inline-block"; }
  renderGrid();
  renderCartBar();
});

db.ref("categories").on("value", snap=>{
  categories = snap.val() || {};
  renderTabs();
  renderGrid();
});

db.ref("items").on("value", snap=>{
  items = snap.val() || {};
  renderGrid();
});

function renderTabs(){
  const tabs = document.getElementById("tabs");
  const catList = Object.entries(categories).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  let html = `<div class="tab ${activeCat==='all'?'active':''}" onclick="setCat('all')">الكل</div>`;
  catList.forEach(([id,c])=>{
    html += `<div class="tab ${activeCat===id?'active':''}" onclick="setCat('${id}')">${c.name}</div>`;
  });
  tabs.innerHTML = html;
}

function setCat(id){
  activeCat = id;
  renderTabs();
  renderGrid();
}

function renderGrid(){
  const grid = document.getElementById("grid");

  if(viewingItem){
    const it = items[viewingItem];
    if(it){
      grid.innerHTML = `<div class="back-bar"><button class="back-btn" onclick="closeItemDetail()">→ رجوع</button></div>` + cardHtml(viewingItem, it);
      return;
    }
    viewingItem = null;
  }

  if(activeCat === "all"){
    renderAllGrouped();
    return;
  }

  let list = Object.entries(items || {}).filter(([id,it])=> it.categoryId === activeCat);
  list.sort((a,b)=>(a[1].order||0)-(b[1].order||0));

  if(list.length === 0){
    grid.innerHTML = `<div class="empty">ما كو أصناف بعد بهذا التصنيف</div>`;
    return;
  }

  grid.innerHTML = list.map(([id,it])=> cardHtml(id, it)).join("");
}

function cardHtml(id, it){
  const sizes = it.sizes && it.sizes.length ? it.sizes : [{label:"", price: it.price || 0}];
  const imgHtml = it.image
    ? `<img class="item-img" src="${it.image}" alt="${it.name}" onclick="openLightbox('${it.image}', event)">`
    : `<div class="no-img">لا توجد صورة</div>`;
  const flavorsHtml = (it.flavors && it.flavors.length)
    ? `<div class="flavors">${it.flavors.map(f=>`<span class="flavor-chip">${f}</span>`).join("")}</div>`
    : "";
  const showSizes = sizes.length > 1 || sizes[0].label;
  const sizeBtns = sizes.map((s,i)=>`<button class="size-btn ${i===0?'active':''}" data-item="${id}" data-idx="${i}" onclick="selectSize(this)">${s.label || 'عادي'}</button>`).join("");
  const offerActive = !!(it.offer && it.offer.active && it.offer.discountPrice);
  const addToCartBtn = settings.whatsappEnabled
    ? `<button class="add-cart-btn" onclick="addToCart('${id}', event)">+ أضف للسلة</button>`
    : "";
  return `
    <div class="card">
      <div class="img-wrap">
        ${imgHtml}
        ${offerActive ? `<div class="offer-badge">عرض</div>` : ""}
      </div>
      <div class="card-body">
        <h3>${it.name}</h3>
        ${flavorsHtml}
        ${showSizes ? `<div class="sizes">${sizeBtns}</div>` : ""}
        <div class="price-row">
          <span id="price-${id}">${priceValueHtml(it, 0)}</span>
        </div>
        ${addToCartBtn}
      </div>
    </div>`;
}

function priceValueHtml(it, idx){
  const sizes = it.sizes && it.sizes.length ? it.sizes : [{label:"", price: it.price || 0}];
  const offerActive = !!(it.offer && it.offer.active && it.offer.discountPrice);
  if(idx === 0 && offerActive){
    return `<span class="price-value"><span class="old-price">${sizes[0].price}</span><span class="price-tag">${it.offer.discountPrice} د.ع</span></span>`;
  }
  return `<span class="price-value"><span class="price-tag">${sizes[idx].price} د.ع</span></span>`;
}

function selectSize(btn){
  const itemId = btn.dataset.item;
  const idx = parseInt(btn.dataset.idx);
  const it = items[itemId];
  selectedSize[itemId] = idx;
  document.querySelectorAll(`.size-btn[data-item="${itemId}"]`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const priceEl = document.getElementById(`price-${itemId}`);
  priceEl.innerHTML = priceValueHtml(it, idx);
}

function renderAllGrouped(){
  const grid = document.getElementById("grid");
  const catList = Object.entries(categories).sort((a,b)=>(a[1].order||0)-(b[1].order||0));

  if(catList.length === 0){
    grid.innerHTML = `<div class="empty">ما كو أصناف بعد</div>`;
    return;
  }

  let html = "";
  catList.forEach(([catId, cat])=>{
    const catItems = Object.entries(items || {})
      .filter(([id,it])=> it.categoryId === catId)
      .sort((a,b)=>(a[1].order||0)-(b[1].order||0));
    if(catItems.length === 0) return;

    const rows = catItems.map(([id,it])=>{
      const sizes = it.sizes && it.sizes.length ? it.sizes : [{label:"", price: it.price || 0}];
      const offerActive = !!(it.offer && it.offer.active && it.offer.discountPrice);
      const imgHtml = it.image
        ? `<img class="row-thumb" src="${it.image}" alt="${it.name}" width="56" height="56" onclick="openLightbox('${it.image}', event)">`
        : `<div class="row-thumb-empty"></div>`;
      const flavorHtml = (it.flavors && it.flavors.length)
        ? `<span class="row-flavor">(${it.flavors.join('، ')})</span>`
        : "";
      const sizesHtml = sizes.map((s,i)=>{
        const label = s.label ? s.label + ': ' : '';
        if(i === 0 && offerActive){
          return `<span class="row-size-item">${label}<span class="row-old-price">${s.price}</span><span class="row-price">${it.offer.discountPrice}</span> د.ع</span>`;
        }
        return `<span class="row-size-item">${label}<span class="row-price">${s.price}</span> د.ع</span>`;
      }).join("");
      return `
        <div class="menu-row" onclick="showItemDetail('${id}')">
          ${imgHtml}
          <div class="row-info">
            <div class="row-name-line">
              <span class="row-name">${it.name}</span>
              ${flavorHtml}
              ${offerActive ? `<span class="row-offer-badge">عرض</span>` : ""}
            </div>
            <div class="row-sizes">${sizesHtml}</div>
          </div>
        </div>`;
    }).join("");

    html += `<div class="cat-section"><span class="cat-title">${cat.name}</span>${rows}</div>`;
  });

  grid.innerHTML = html || `<div class="empty">ما كو أصناف بعد</div>`;
}
</script>
</body>
</html>
